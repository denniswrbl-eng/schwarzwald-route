<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Schwarzwald">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><text y='.9em' font-size='76' x='12'>🌲</text></svg>">
  <title>Schwarzwald Route</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    :root {
      --bg0: #000000;
      --bg1: #1c1c1e;
      --bg2: #2c2c2e;
      --bg3: #3a3a3c;
      --label:  #ffffff;
      --label2: rgba(255,255,255,0.6);
      --label3: rgba(255,255,255,0.3);
      --blue:   #0a84ff;
      --green:  #30d158;
      --red:    #ff453a;
      --orange: #ff9f0a;
      --purple: #bf5af2;
      --sep:    rgba(255,255,255,0.12);
      --r-card:  16px;
      --r-sheet: 22px;
      --safe-t: env(safe-area-inset-top,    0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --sheet-peek: 88px;
      --accent: var(--blue);
    }
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg0);
      overflow: hidden;
      font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
      color: var(--label);
      overscroll-behavior: none;
    }

    /* Map */
    #map { position: fixed; inset: 0; }
    .maplibregl-ctrl-attrib {
      font-size: 9px !important;
      background: rgba(0,0,0,0.6) !important;
      color: rgba(255,255,255,0.4) !important;
    }
    .maplibregl-ctrl-logo { display: none !important; }

    /* Header */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      padding: calc(var(--safe-t) + 14px) 18px 16px;
      background: linear-gradient(to bottom,rgba(0,0,0,0.78) 0%,rgba(0,0,0,0.3) 65%,transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    #header > * { pointer-events: auto; }

    .hdr-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .hdr-title { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; }
    .hdr-sub   { font-size: 12px; color: var(--label2); margin-top: 1px; }

    /* Fly button */
    #fly-btn {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 7px;
      padding: 11px 18px;
      min-height: 44px;
      border-radius: 22px; border: none;
      background: var(--accent);
      color: #fff;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: background 0.25s, opacity 0.15s, transform 0.1s;
      box-shadow: 0 2px 16px rgba(10,132,255,0.35);
    }
    #fly-btn:active { opacity: 0.75; transform: scale(0.95); }
    #fly-btn.flying { background: var(--red); box-shadow: 0 2px 16px rgba(255,69,58,0.4); }
    #fly-icon { font-size: 13px; line-height: 1; }
    #fly-progress { font-size: 12px; font-weight: 600; opacity: 0.85; margin-left: 2px; }

    /* Option toggle (segmented control) */
    #option-toggle {
      display: flex;
      background: rgba(28,28,30,0.85);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-radius: 13px;
      border: 0.5px solid var(--sep);
      padding: 3px;
      gap: 3px;
      align-self: flex-start;
    }
    .opt-btn {
      padding: 10px 14px;
      min-height: 36px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--label2);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.12s;
      white-space: nowrap;
    }
    .opt-btn:active { transform: scale(0.96); }
    .opt-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(10,132,255,0.25);
    }

    /* Compass */
    #compass {
      position: fixed;
      top: calc(var(--safe-t) + 106px);
      right: 16px;
      z-index: 300;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(28,28,30,0.85);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 0.5px solid var(--sep);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #compass:active { transform: scale(0.9); }
    #compass svg { display: block; pointer-events: none; will-change: transform; }

    /* Progress dots */
    #dots {
      position: fixed;
      left: 50%; transform: translateX(-50%);
      bottom: calc(var(--safe-b) + var(--sheet-peek) + 12px);
      z-index: 250;
      display: flex; gap: 6px; align-items: center;
      padding: 6px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.32);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: opacity 0.35s, transform 0.35s;
    }
    #dots.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(8px); }
    .dot {
      width: 6px; height: 6px; border-radius: 3px;
      background: rgba(255,255,255,0.3);
      transition: width 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
    }
    .dot.on { width: 20px; background: #fff; }
    #dots.flying .dot.on {
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%,100% { background: #fff; }
      50%      { background: var(--red); }
    }

    /* Bottom Sheet */
    #sheet {
      position: fixed; inset: auto 0 0 0;
      z-index: 400;
      background: rgba(18,18,20,0.97);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      backdrop-filter: blur(12px) saturate(160%);
      border-radius: var(--r-sheet) var(--r-sheet) 0 0;
      border-top: 0.5px solid var(--sep);
      box-shadow: 0 -4px 40px rgba(0,0,0,0.5);
      transform: translateY(0);
      transition: transform 0.42s cubic-bezier(0.32,0.72,0,1);
      will-change: transform;
      touch-action: pan-y;
    }
    #sheet.collapsed {
      transform: translateY(calc(100% - var(--sheet-peek) - var(--safe-b)));
    }
    .handle-zone {
      padding: 14px 0 10px;
      display: flex; justify-content: center;
      cursor: grab; user-select: none;
      touch-action: none;
    }
    .handle-zone:active { cursor: grabbing; }
    .handle {
      width: 38px; height: 5px;
      border-radius: 3px;
      background: var(--label3);
      transition: background 0.2s, width 0.2s;
    }
    .handle-zone:active .handle { background: rgba(255,255,255,0.55); width: 44px; }
    .sheet-top {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 2px 20px 12px;
      cursor: pointer;
      gap: 12px;
    }
    .sheet-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .sheet-meta {
      font-size: 13px; font-weight: 500;
      color: var(--label2);
      background: var(--bg2);
      padding: 5px 11px; border-radius: 11px;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    /* Cards */
    #cards {
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      touch-action: pan-x;
      display: flex; gap: 12px;
      padding: 4px 20px calc(var(--safe-b) + 24px);
      scrollbar-width: none;
    }
    #cards::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 calc(100vw - 56px);
      scroll-snap-align: start;
      background: var(--bg2);
      border-radius: var(--r-card);
      padding: 14px 16px 16px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: border-color 0.25s, transform 0.15s, opacity 0.15s, box-shadow 0.25s;
      min-height: 148px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card:active { transform: scale(0.975); opacity: 0.85; }
    .card.active  {
      border-color: var(--accent);
      box-shadow: 0 4px 24px rgba(10,132,255,0.18);
    }
    /* First-run swipe hint: tiny nudge to suggest horizontal swipe */
    @keyframes swipe-nudge {
      0%   { transform: translateX(0); }
      30%  { transform: translateX(-22px); }
      55%  { transform: translateX(-22px); }
      100% { transform: translateX(0); }
    }
    #cards.hint .card:first-child { animation: swipe-nudge 1.6s cubic-bezier(0.32,0.72,0,1); }

    .card-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(10,132,255,0.18);
      color: var(--accent);
      font-size: 12px; font-weight: 700;
      padding: 5px 11px; border-radius: 10px;
      letter-spacing: 0.2px; width: fit-content;
    }
    .card-badge.train { background: rgba(191,90,242,0.18); color: var(--purple); }
    .card-name  { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.15; }
    .card-sub   { font-size: 13px; color: var(--label2); line-height: 1.4; }
    .card-stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 2px; }
    .stat       {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px;
      background: rgba(255,255,255,0.05);
      padding: 5px 9px; border-radius: 9px;
    }
    .stat-icon  { font-size: 14px; }
    .stat-val   { font-weight: 600; color: var(--label); }
    .stat-lbl   { color: var(--label2); }

    /* Card photo */
    .card-photo {
      width: 100%; height: 130px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: linear-gradient(110deg, #2c2c2e 8%, #3a3a3c 18%, #2c2c2e 33%);
      background-size: 220% 100%;
      animation: skeleton 1.4s ease-in-out infinite;
      transition: opacity 0.35s;
      opacity: 0.6;
    }
    .card-photo[data-loaded="1"] {
      animation: none;
      background: transparent;
      opacity: 1;
    }
    @keyframes skeleton {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* Travel info row (Option B only) */
    .travel-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--label2);
      padding: 6px 10px;
      background: rgba(191,90,242,0.1);
      border-radius: 10px;
    }
    .travel-row strong { color: var(--purple); }

    /* Dennis avatar + speech bubble */
    .dennis-row {
      display: flex; align-items: flex-end; gap: 9px;
      margin-top: 6px;
    }
    .dennis-avatar {
      width: 38px; height: 38px; flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .dennis-bubble {
      position: relative;
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 0.5px solid rgba(255,255,255,0.14);
      border-radius: 14px 14px 14px 4px;
      padding: 8px 11px;
      font-size: 12.5px; color: rgba(255,255,255,0.88);
      line-height: 1.45;
      min-height: 38px;
      display: flex; align-items: center;
      word-break: break-word;
    }
    .dennis-bubble::before {
      content: '';
      position: absolute;
      left: -5px; bottom: 0;
      width: 10px; height: 10px;
      background: rgba(255,255,255,0.08);
      border-left: 0.5px solid rgba(255,255,255,0.14);
      border-bottom: 0.5px solid rgba(255,255,255,0.14);
      border-bottom-left-radius: 3px;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .dennis-bubble.typing::after {
      content: '▍';
      display: inline-block;
      margin-left: 2px;
      color: rgba(255,255,255,0.55);
      font-size: 10px;
      animation: blink 0.85s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes dennis-breathe {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-1.5px); }
    }
    .dennis-avatar { animation: dennis-breathe 3s ease-in-out infinite; }
    .card:not(.active) .dennis-avatar { animation-play-state: paused; }
    .card:not(.active) .dennis-bubble { opacity: 0.55; }

    /* Waypoint markers */
    .wp-pin {
      position: relative;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--blue);
      border: 2.5px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(0,0,0,0.55);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.2s;
      user-select: none;
    }
    .wp-pin:active { transform: scale(0.88); }
    .wp-pin.active { transform: scale(1.18); }
    .wp-pin.train-pin { background: var(--purple); border-color: rgba(255,255,255,0.9); }
    /* Pulse-Ring um aktiven Pin (Pairing mit .card.active-Glow) */
    .wp-pin.active::after {
      content: '';
      position: absolute;
      top: -2.5px; left: -2.5px;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      pointer-events: none;
      animation: wp-pulse 1.8s ease-out infinite;
    }
    .wp-pin.train-pin.active::after { border-color: var(--purple); }
    @keyframes wp-pulse {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(1.8); opacity: 0;   }
    }

    /* Train station markers (dots along route) */
    .train-stop {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--purple);
      border: 2px solid rgba(255,255,255,0.6);
      box-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    /* Hamm-Startpunkt (grau, dezent) — Option A */
    .hamm-stop {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(0,0,0,0.6);
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* Loading */
    #loader {
      position: fixed; inset: 0; z-index: 900;
      background: var(--bg0);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      transition: opacity 0.6s;
    }
    #loader.fade { opacity: 0; pointer-events: none; }
    .loader-emoji { font-size: 52px; animation: pulse 2s ease-in-out infinite; }
    .loader-text  { font-size: 17px; font-weight: 600; color: var(--label2); }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.08); opacity: 0.7; }
    }

    /* Toast */
    #toast {
      position: fixed;
      top: calc(var(--safe-t) + 80px);
      left: 50%; transform: translateX(-50%) translateY(-20px);
      z-index: 500;
      background: rgba(28,28,30,0.95);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 0.5px solid var(--sep);
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 14px; font-weight: 500;
      white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Laura Splash (Erstbesuch-Reveal) — z-index über allem, auch über #loader */
    #laura-splash {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg0);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      padding: calc(var(--safe-t) + 32px) 28px calc(var(--safe-b) + 32px);
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.6s ease-out;
      will-change: opacity;
    }
    #laura-splash.fade { opacity: 0; pointer-events: none; }
    .laura-tree {
      font-size: 64px;
      line-height: 1;
      opacity: 0;
      animation: laura-fade-up 0.6s 0ms ease-out forwards;
    }
    .laura-title {
      font-size: 34px; font-weight: 700; letter-spacing: -0.6px;
      color: #e8c890;
      opacity: 0;
      animation: laura-fade-up 0.6s 200ms ease-out forwards;
    }
    .laura-sub {
      font-size: 15px; font-weight: 500;
      color: var(--label2);
      opacity: 0;
      animation: laura-fade-up 0.6s 800ms ease-out forwards;
    }
    .laura-hint {
      margin-top: 28px;
      font-size: 13px; font-weight: 500;
      color: var(--label3);
      opacity: 0;
      animation: laura-hint-in 0.6s 1400ms ease-out forwards,
                 laura-hint-pulse 2.4s 2000ms ease-in-out infinite;
    }
    @keyframes laura-fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes laura-hint-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 0.55; transform: translateY(0); }
    }
    @keyframes laura-hint-pulse {
      0%,100% { opacity: 0.55; }
      50%      { opacity: 0.95; }
    }
  </style>
</head>
<body>

<div id="laura-splash" aria-label="Tippen zum Starten">
  <div class="laura-tree" aria-hidden="true">🌲</div>
  <div class="laura-title">Für dich, Laura</div>
  <div class="laura-sub">13. – 16. Mai 2026 · Schwarzwald</div>
  <div class="laura-hint" aria-hidden="true">Tippen zum Starten</div>
</div>

<div id="loader">
  <div class="loader-emoji">🌲</div>
  <div class="loader-text">Schwarzwald wird geladen…</div>
</div>

<div id="toast"></div>
<div id="map"></div>

<!-- Header -->
<div id="header">
  <div class="hdr-row1">
    <div>
      <div class="hdr-title">Schwarzwald Route</div>
      <div class="hdr-sub">13.–16. Mai 2026 · 2 Personen</div>
    </div>
    <button id="fly-btn" onclick="toggleFlyRoute()" aria-label="Automatischen Kamera-Flug starten">
      <span id="fly-icon">▶</span>
      <span id="fly-label">Fly Route</span>
      <span id="fly-progress" hidden></span>
    </button>
  </div>

  <!-- Option toggle -->
  <div id="option-toggle">
    <button class="opt-btn active" id="btn-a" onclick="switchOption('A')">🚐 Option A · Bulli</button>
    <button class="opt-btn"        id="btn-b" onclick="switchOption('B')">🚂 Option B · Zug</button>
  </div>
</div>

<div id="compass" onclick="resetCamera()" aria-label="Norden ausrichten">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
    <path d="M12 2.5 L17 13.5 L12 11 L7 13.5 Z"
          fill="#ff453a" stroke="#fff" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M12 21.5 L7 10.5 L12 13 L17 10.5 Z"
          fill="rgba(255,255,255,0.75)"/>
  </svg>
</div>

<div id="dots">
  <div class="dot on" data-i="0"></div>
  <div class="dot"    data-i="1"></div>
  <div class="dot"    data-i="2"></div>
  <div class="dot"    data-i="3"></div>
</div>

<div id="sheet" class="collapsed">
  <div class="handle-zone" id="handle-zone"><div class="handle"></div></div>
  <div class="sheet-top" onclick="toggleSheet()">
    <div class="sheet-title" id="sheet-title">Etappen</div>
    <div class="sheet-meta" id="sheet-meta">4 Tage · Bulli</div>
  </div>
  <div id="cards"></div>
</div>

<script>
// ════════════════════════════════════════════════
//  LAURA SPLASH (Erstbesuch-Reveal)
// ════════════════════════════════════════════════
(function() {
  const splash = document.getElementById('laura-splash');
  if (!splash) return;
  if (localStorage.getItem('lauraSplashSeen')) {
    splash.remove();
    return;
  }
  let dismissed = false;
  function dismiss() {
    if (dismissed) return;
    dismissed = true;
    try { localStorage.setItem('lauraSplashSeen', '1'); } catch (e) {}
    splash.classList.add('fade');
    setTimeout(() => splash.remove(), 700);
  }
  splash.addEventListener('click', dismiss);
  splash.addEventListener('touchstart', dismiss, { passive: true });
})();


// ════════════════════════════════════════════════
//  DATA — OPTION A (Bulli)
// ════════════════════════════════════════════════
const WPS_A = [
  {
    id: 0, name: 'Zwischenstopp Pfalz', sub: '~320 km · Bulli-Schlaf',
    day: 'Mi 13.05.', badge: 'Tag 1', emoji: '🌙',
    lng: 8.1397, lat: 49.3517,
    zoom: 10, pitch: 35, bearing: 0,
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Weinberge_bei_Pleisweiler.JPG?width=400',
    stats: [
      { icon: '🚐', val: '~320 km', lbl: 'von Hamm' },

// ════════════════════════════════════════════════
//  MAP INIT
// ════════════════════════════════════════════════
function initMap() {
  map = new maplibregl.Map({
    container: 'map',
    style:     DARK_STYLE,
    center:    [8.19, 48.23],
    zoom:      8.2, pitch: 45, bearing: -8,
    antialias: false,
    attributionControl: { compact: true },
    maxPitch: 80,
    fadeDuration: 0,
    maxTileCacheSize: 50,
    refreshExpiredTiles: false,
  });
  map.on('load', onMapLoad);
  map.on('error', () => hideLoader());
}

function onMapLoad() {
  // 3D-Terrain deaktiviert — terrarium-DEM-Tiles waren auf Mobile-GPU
  // zu schwer und blockierten das Tile-Streaming. Map bleibt 2.5D
  // (pitch/bearing funktionieren weiterhin).

  // (kein Sky-Layer — MapLibre 4.7.1 unterstützt type:'sky' nicht;
  // der dunkle bg-Background-Layer dient als Horizont/Sky-Ersatz)

  // ── Option A: Bulli route ──────────────────────
  map.addSource('route-a', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: WPS_A.map(w => [w.lng, w.lat]) } },
  });
  map.addLayer({ id: 'route-a-line-casing', type: 'line', source: 'route-a',
    paint: { 'line-color': '#003e7a', 'line-width': 6.5, 'line-opacity': 0.85 },
    layout: { 'line-cap': 'round', 'line-join': 'round' } });
  map.addLayer({ id: 'route-a-line', type: 'line', source: 'route-a',
    paint: { 'line-color': '#0a84ff', 'line-width': 3.5, 'line-opacity': 1, 'line-dasharray': [3,2] },
    layout: { 'line-cap': 'round', 'line-join': 'round' } });

  // ── Option A: Anreise Hamm→Pfalz + Heimweg Triberg→Hamm ──
  map.addSource('route-a-extra', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: [
        { type: 'Feature', properties: { kind: 'arrive' },
          geometry: { type: 'LineString', coordinates: [[7.819, 51.679], [8.1397, 49.3517]] } },
        { type: 'Feature', properties: { kind: 'return' },
          geometry: { type: 'LineString', coordinates: [[8.2220, 48.0617], [7.819, 51.679]] } },
      ],
    },
  });
  map.addLayer({ id: 'route-a-extra-line', type: 'line', source: 'route-a-extra',
    paint: { 'line-color': '#0a84ff', 'line-width': 2, 'line-opacity': 0.55, 'line-dasharray': [1, 3] },
    layout: { 'line-cap': 'round', 'line-join': 'round' } });

  // ── Option B: Zugstrecke ───────────────────────
  // Zwei Linien aus einer Source: Anreise (kräftig) + Heimweg-Schwarzwaldbahn (dünner)
  map.addSource('route-b', {
    type: 'geojson',
    data: TRAIN_ROUTE,
  });
  map.addLayer({ id: 'route-b-arrive-casing', type: 'line', source: 'route-b',
    filter: ['==', ['get', 'kind'], 'arrive'],
    paint: { 'line-color': '#5a1f8a', 'line-width': 6.5, 'line-opacity': 0.85 },
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' } });
  map.addLayer({ id: 'route-b-arrive', type: 'line', source: 'route-b',
    filter: ['==', ['get', 'kind'], 'arrive'],
    paint: { 'line-color': '#bf5af2', 'line-width': 3.5, 'line-opacity': 1, 'line-dasharray': [2, 3] },
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' } });
  map.addLayer({ id: 'route-b-return-casing', type: 'line', source: 'route-b',
    filter: ['==', ['get', 'kind'], 'return'],
    paint: { 'line-color': '#5a1f8a', 'line-width': 5.5, 'line-opacity': 0.85 },
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' } });
  map.addLayer({ id: 'route-b-return', type: 'line', source: 'route-b',
    filter: ['==', ['get', 'kind'], 'return'],
    paint: { 'line-color': '#bf5af2', 'line-width': 2.5, 'line-opacity': 0.7, 'line-dasharray': [1, 2.5] },
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' } });

  // Option B: lokale Tagesrouten (Hinterzarten ↔ Feldberg, ↔ Schluchsee)
  const localB = [
    [[8.1186, 47.9065], [8.0047, 47.8742]],   // Hinterzarten → Feldberg
    [[8.1186, 47.9065], [8.0090, 47.8195]],   // Hinterzarten → Schluchsee
    [[8.1186, 47.9065], [8.1500, 47.8980]],   // Hinterzarten → Titisee
  ];
  map.addSource('route-b-local', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: localB.map(coords => ({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: coords },
      })),
    },
  });
  map.addLayer({ id: 'route-b-local-line-casing', type: 'line', source: 'route-b-local',
    paint: { 'line-color': '#5a1f8a', 'line-width': 6.5, 'line-opacity': 0.9 },
    layout: { 'line-cap': 'round', visibility: 'none' } });
  map.addLayer({ id: 'route-b-local-line', type: 'line', source: 'route-b-local',
    paint: { 'line-color': '#bf5af2', 'line-width': 3.5, 'line-opacity': 0.9, 'line-dasharray': [3, 3] },
    layout: { 'line-cap': 'round', visibility: 'none' } });

  // ── Reisender-Marker (animiert bei Fly-Route) ──
  map.addSource('traveler', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] } },
  });
  map.addLayer({ id: 'traveler-dot', type: 'circle', source: 'traveler',
    paint: {
      'circle-radius':       7,
      'circle-color':        '#0a84ff',
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 2.5,
      'circle-opacity':      0,
    } });

  // ── Waypoint markers ───────────────────────────
  buildMarkers();

  // ── Train stop dots ───────────────────────────
  buildTrainStops();

  // ── Hamm-Mini-Dot (Startpunkt Bulli-Anreise) ──
  buildHammStop();

  // ── Cards ──────────────────────────────────────
  buildCards();

  // ── Scroll-Listener einmalig anhängen (Bug 1) ─
  document.getElementById('cards')
    .addEventListener('scroll', onCardsScroll, { passive: true });

  // ── Compass dreht mit Bearing ─────────────────
  const compassSvg = document.querySelector('#compass svg');
  const updateCompass = () => {
    if (compassSvg) compassSvg.style.transform = `rotate(${-map.getBearing()}deg)`;
  };
  map.on('rotate', updateCompass);
  map.on('move',   updateCompass);
  updateCompass();

  // ── Intro fly-in ──────────────────────────────
  hideLoader();
  setTimeout(() => {
    map.flyTo({ center: [8.19, 48.22], zoom: 9.0, pitch: 52, bearing: -10, duration: 2800, essential: true, padding: FLY_PADDING });
    introSheetTimer = setTimeout(() => {
      introSheetTimer = null;
      if (isFlyingRoute) return;
      openSheet();
      // Nach Sheet-Animation: Speech starten + Swipe-Hint einmalig
      firstSpeechTimer = setTimeout(() => {
        firstSpeechTimer = null;
        triggerSpeech(0);
        runSwipeHint();
      }, 480);
    }, 3400);
  }, 300);
}

// Einmaliger Swipe-Hint: leichter Bounce der ersten Card,
// damit Laura sieht, dass die Cards horizontal swipebar sind.
function runSwipeHint() {
  if (sessionStorage.getItem('swipeHintShown')) return;
  const wrap = document.getElementById('cards');
  if (!wrap) return;
  sessionStorage.setItem('swipeHintShown', '1');
  wrap.classList.add('hint');
  setTimeout(() => wrap.classList.remove('hint'), 1700);
}

// ════════════════════════════════════════════════
//  MARKERS
// ════════════════════════════════════════════════
function buildMarkers() {
  markers.forEach(({ marker }) => marker.remove());
  markers = [];

  activeWps().forEach((wp, i) => {
    const el = document.createElement('div');
    el.className = 'wp-pin' + (i === activeIdx ? ' active' : '') + (wp.isTrain ? ' train-pin' : '');
    el.textContent = i + 1;
    el.addEventListener('click', () => flyTo(i));
    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([wp.lng, wp.lat]).addTo(map);
    markers.push({ marker: m, el });
  });
}

function buildTrainStops() {
  stopMarkers.forEach(m => m.remove());
  stopMarkers = [];
  if (currentOption !== 'B') return;

  TRAIN_STOPS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'train-stop';
    el.title = s.name;
    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([s.lng, s.lat]).addTo(map);
    stopMarkers.push(m);
  });
}

function buildHammStop() {
  if (hammMarker) { hammMarker.remove(); hammMarker = null; }
  if (currentOption !== 'A') return;

  const el = document.createElement('div');
  el.className = 'hamm-stop';
  el.title = 'Hamm Hbf · Start';
  hammMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
    .setLngLat([7.819, 51.679]).addTo(map);
}

// ════════════════════════════════════════════════
//  OPTION SWITCH
// ════════════════════════════════════════════════
function switchOption(opt) {
  if (currentOption === opt) return;
  if (!map || !map.isStyleLoaded()) return;
  currentOption = opt;
  activeIdx = 0;

  // Toggle button states
  document.getElementById('btn-a').classList.toggle('active', opt === 'A');
  document.getElementById('btn-b').classList.toggle('active', opt === 'B');

  // Map layer visibility
  const showA = opt === 'A' ? 'visible' : 'none';
  const showB = opt === 'B' ? 'visible' : 'none';
  ['route-a-line', 'route-a-line-casing', 'route-a-extra-line'].forEach(id => map.setLayoutProperty(id, 'visibility', showA));
  ['route-b-arrive',     'route-b-arrive-casing',
   'route-b-return',     'route-b-return-casing',
   'route-b-local-line', 'route-b-local-line-casing'].forEach(id => map.setLayoutProperty(id, 'visibility', showB));

  // Accent color CSS
  document.documentElement.style.setProperty('--accent', opt === 'A' ? 'var(--blue)' : 'var(--purple)');

  // Reisender-Dot folgt der Accent-Farbe
  if (map.getLayer('traveler-dot')) {
    map.setPaintProperty('traveler-dot', 'circle-color', opt === 'A' ? '#0a84ff' : '#bf5af2');
  }

  // Update sheet meta
  document.getElementById('sheet-meta').textContent = opt === 'A' ? '4 Tage · Bulli' : '4 Tage · Zug + Zelt';

  // Rebuild markers + stops + cards
  buildMarkers();
  buildTrainStops();
  buildHammStop();
  buildCards();
  setActive(0);

  // Camera: zoom out to show full train route for B
  map.stop();
  if (opt === 'B') {
    map.flyTo({ center: [7.8, 49.8], zoom: 5.5, pitch: 35, bearing: 0, duration: 2200, essential: true, padding: FLY_PADDING });
    showToast('Option B: Zug + Zelt 🚂');
  } else {
    map.flyTo({ center: [8.19, 48.22], zoom: 9.0, pitch: 52, bearing: -10, duration: 2000, essential: true, padding: FLY_PADDING });
    showToast('Option A: Bulli 🚐');
  }
}

          <circle cx="39" cy="59" r="5" fill="#4e7890"/>
          <circle cx="61" cy="59" r="5" fill="#4e7890"/>
          <circle cx="39" cy="59" r="3" fill="#0a0a10"/>
          <circle cx="61" cy="59" r="3" fill="#0a0a10"/>
          <circle cx="41" cy="57" r="1.5" fill="white"/>
          <circle cx="63" cy="57" r="1.5" fill="white"/>
          <path d="M44 75 Q50 79 56 75" fill="none" id="mouth-${i}" stroke="#a06040" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="dennis-bubble" id="bubble-${i}"></div>
      </div>` : ''}
    `;
    card.addEventListener('click', () => flyTo(i));
    wrap.appendChild(card);
  });
}

function onCardsScroll() {
  if (userScrolling || isFlyingRoute) return;
  clearTimeout(scrollDebounce);
  scrollDebounce = setTimeout(() => {
    const wrap  = document.getElementById('cards');
    const cardW = (wrap.firstElementChild?.offsetWidth ?? 0) + 12;
    const idx   = Math.round(wrap.scrollLeft / cardW);
    if (idx >= 0 && idx < activeWps().length && idx !== activeIdx) {
      setActive(idx);
      flyTo(idx, true);
    }
  }, 120);
}

function scrollCardIntoView(idx) {
  if (scrollRAF) { cancelAnimationFrame(scrollRAF); scrollRAF = null; }
  const wrap  = document.getElementById('cards');
  const cardW = (wrap.firstElementChild?.offsetWidth ?? 0) + 12;
  userScrolling = true;
  wrap.scrollTo({ left: idx * cardW, behavior: 'smooth' });
  let last = wrap.scrollLeft, stableFrames = 0;
  const tick = () => {
    if (Math.abs(wrap.scrollLeft - last) < 0.5) {
      if (++stableFrames > 6) { userScrolling = false; scrollRAF = null; return; }
    } else { stableFrames = 0; last = wrap.scrollLeft; }
    scrollRAF = requestAnimationFrame(tick);
  };
  scrollRAF = requestAnimationFrame(tick);
}

// ════════════════════════════════════════════════
//  ACTIVE STATE
// ════════════════════════════════════════════════
function setActive(idx) {
  if (firstSpeechTimer) { clearTimeout(firstSpeechTimer); firstSpeechTimer = null; }
  activeIdx = idx;
  document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i === idx));
  markers.forEach(({ el }, i) => {
    el.classList.toggle('active', i === idx);
    el.style.transform = i === idx ? 'scale(1.18)' : '';
  });
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === idx));
  triggerSpeech(idx);
}

function triggerSpeech(idx) {
  if (speechTimer) clearTimeout(speechTimer);
  if (talkTimer)   clearInterval(talkTimer);
  document.querySelectorAll('.dennis-bubble').forEach(b => {
    b.textContent = '';
    b.classList.remove('typing');
  });
  document.querySelectorAll('[id^="mouth-"]').forEach(m => m.setAttribute('d', MOUTH_C));

  const bubble = document.getElementById('bubble-' + idx);
  const mouth  = document.getElementById('mouth-' + idx);
  if (!bubble || !mouth) return;

  const text = activeWps()[idx]?.speech || '';
  if (!text) return;

  bubble.classList.add('typing');
  let open = false;
  talkTimer = setInterval(() => {
    open = !open;
    mouth.setAttribute('d', open ? MOUTH_O : MOUTH_C);
  }, 105);

  let i = 0;
  function type() {
    if (i < text.length) {
      bubble.textContent += text[i++];
      speechTimer = setTimeout(type, 34);
    } else {
      clearInterval(talkTimer);
      talkTimer = null;
      mouth.setAttribute('d', MOUTH_C);
      // Cursor noch ~1s nachblinken, dann ausblenden
      speechTimer = setTimeout(() => bubble.classList.remove('typing'), 1100);
    }
  }
  type();
}

// ════════════════════════════════════════════════
//  CAMERA
// ════════════════════════════════════════════════
function animateTraveler(from, to, duration) {
  if (travelerRAF) cancelAnimationFrame(travelerRAF);
  const src = map.getSource('traveler');
  if (!src) return;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
    const lng = from[0] + (to[0] - from[0]) * ease;
    const lat = from[1] + (to[1] - from[1]) * ease;
    src.setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] } });
    if (t < 1 && isFlyingRoute) travelerRAF = requestAnimationFrame(tick);
  }
  travelerRAF = requestAnimationFrame(tick);
}

function flyTo(idx, fromScroll = false) {
  if (!map) return;
  const wp = activeWps()[idx];
  setActive(idx);
  if (!fromScroll) scrollCardIntoView(idx);
  map.stop();
  map.flyTo({
    center: [wp.lng, wp.lat], zoom: wp.zoom, pitch: wp.pitch, bearing: wp.bearing,
    duration: 1800, essential: true, curve: 1.2, speed: 0.9, padding: FLY_PADDING,
  });
}

function resetCamera() {
  if (!map) return;
  map.stop();
  if (currentOption === 'B') {
    map.flyTo({ center: [7.8, 49.8], zoom: 5.5, pitch: 35, bearing: 0, duration: 1800, essential: true, padding: FLY_PADDING });
  } else {
    map.flyTo({ center: [8.19, 48.22], zoom: 9.0, pitch: 48, bearing: -10, duration: 1800, essential: true, padding: FLY_PADDING });
  }
}

// ════════════════════════════════════════════════
//  FLY ROUTE
// ════════════════════════════════════════════════
function toggleFlyRoute() { isFlyingRoute ? stopFlyRoute() : startFlyRoute(); }

function startFlyRoute() {
  if (introSheetTimer) { clearTimeout(introSheetTimer); introSheetTimer = null; }
  isFlyingRoute = true;
  const total = activeWps().length;
  const flyBtn  = document.getElementById('fly-btn');
  const flyProg = document.getElementById('fly-progress');
  flyBtn.classList.add('flying');
  document.getElementById('fly-icon').textContent  = '■';
  document.getElementById('fly-label').textContent = 'Stop';
  flyProg.hidden = false;
  // Dots bleiben sichtbar, pulsen aber rot — visueller Anker
  document.getElementById('dots').classList.add('flying');
  closeSheet();
  showToast('Kamera-Flug · Tag 1/' + total + ' 🎬');

  // Reisender-Dot beim ersten Waypoint einsetzen + sichtbar machen
  const wps = activeWps();
  const startWp = wps[0];
  map.getSource('traveler').setData({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [startWp.lng, startWp.lat] },
  });
  map.setPaintProperty('traveler-dot', 'circle-opacity', 1);

  let step = 0;
  function next() {
    if (!isFlyingRoute) return;
    if (step >= total) { stopFlyRoute(); return; }
    flyProg.textContent = '· ' + (step + 1) + '/' + total;
    flyTo(step);
    const prev = step === 0 ? wps[0] : wps[step - 1];
    const curr = wps[step];
    animateTraveler([prev.lng, prev.lat], [curr.lng, curr.lat], 1800);
    step++;
    flyTimer = setTimeout(next, 4200);
  }
  next();
}

function stopFlyRoute() {
  isFlyingRoute = false;
  if (flyTimer) { clearTimeout(flyTimer); flyTimer = null; }
  if (travelerRAF) { cancelAnimationFrame(travelerRAF); travelerRAF = null; }
  if (map && map.getLayer('traveler-dot')) {
    map.setPaintProperty('traveler-dot', 'circle-opacity', 0);
  }
  const flyProg = document.getElementById('fly-progress');
  document.getElementById('fly-btn').classList.remove('flying');
  document.getElementById('fly-icon').textContent  = '▶';
  document.getElementById('fly-label').textContent = 'Fly Route';
  flyProg.hidden = true;
  flyProg.textContent = '';
  document.getElementById('dots').classList.remove('flying');
  openSheet();
}

// ════════════════════════════════════════════════
//  SHEET
// ════════════════════════════════════════════════
function openSheet()   { sheetOpen = true;  document.getElementById('sheet').classList.remove('collapsed'); }
function closeSheet()  { sheetOpen = false; document.getElementById('sheet').classList.add('collapsed'); }
function toggleSheet() { sheetOpen ? closeSheet() : openSheet(); }

// Live-Drag mit Velocity-basiertem Snap.
// Sheet folgt dem Finger 1:1, Snapping nach Geschwindigkeit (Flick) oder Distanz (Slow Drag).
(function setupDrag() {
  const sheet = document.getElementById('sheet');
  const handleZone = document.getElementById('handle-zone');
  const sheetTop = document.querySelector('.sheet-top');

  let startY = 0, lastY = 0, lastT = 0, velocity = 0;
  let startOpen = false, dragging = false;

  function isDragSurface(t) {
    return handleZone.contains(t) || sheetTop.contains(t);
  }
  function collapsedOffset() {
    const cs = getComputedStyle(document.documentElement);
    const peek = parseFloat(cs.getPropertyValue('--sheet-peek')) || 88;
    const safeB = parseFloat(cs.getPropertyValue('--safe-b')) || 0;
    return sheet.offsetHeight - peek - safeB;
  }

  sheet.addEventListener('touchstart', e => {
    if (!isDragSurface(e.target)) return;
    const y = e.touches[0].clientY;
    startY = lastY = y;
    lastT = performance.now();
    velocity = 0;
    startOpen = sheetOpen;
    dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  sheet.addEventListener('touchmove', e => {
    if (!dragging) return;
    const y = e.touches[0].clientY;
    const t = performance.now();
    const dt = t - lastT;
    if (dt > 0) {
      // Geglättete Velocity (px/ms; positiv = nach unten)
      const v = (y - lastY) / dt;
      velocity = velocity * 0.5 + v * 0.5;
    }
    lastY = y; lastT = t;

    const off = collapsedOffset();
    const base = startOpen ? 0 : off;
    // Mit Rubber-Band-Effekt jenseits der Endpunkte
    let translate = base + (y - startY);
    if (translate < 0)   translate = translate * 0.25;
    if (translate > off) translate = off + (translate - off) * 0.25;
    sheet.style.transform = `translateY(${translate}px)`;
  }, { passive: true });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    sheet.style.transform = '';

    const dy = lastY - startY;
    const v  = velocity; // px/ms
    let shouldOpen;
    if (Math.abs(v) > 0.4) {
      shouldOpen = v < 0; // schneller Flick
    } else {
      shouldOpen = startOpen ? dy < 80 : dy < -50;
    }
    shouldOpen ? openSheet() : closeSheet();
  }

  sheet.addEventListener('touchend',    endDrag, { passive: true });
  sheet.addEventListener('touchcancel', endDrag, { passive: true });
})();

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ════════════════════════════════════════════════
//  LOADING
// ════════════════════════════════════════════════
function hideLoader() {
  const l = document.getElementById('loader');
  if (!l || l.classList.contains('fade')) return;
  l.classList.add('fade');
  setTimeout(() => l.remove(), 700);
}

    document.querySelectorAll('[id^="mouth-"]').forEach(m => m.setAttribute('d', MOUTH_C));

    if (map) map.stop();

});
