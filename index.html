<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Schwarzwald">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><text y='.9em' font-size='76' x='12'>🌲</text></svg>">

  <title>Schwarzwald Route</title>

  <!-- MapLibre GL JS 4 -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    /* ── Design tokens (iOS Dark) ─────────────────── */
    :root {
      --bg0: #000000;
      --bg1: #1c1c1e;
      --bg2: #2c2c2e;
      --bg3: #3a3a3c;
      --label:    #ffffff;
      --label2:   rgba(255,255,255,0.6);
      --label3:   rgba(255,255,255,0.3);
      --blue:     #0a84ff;
      --green:    #30d158;
      --red:      #ff453a;
      --orange:   #ff9f0a;
      --sep:      rgba(255,255,255,0.12);
      --r-card:   16px;
      --r-sheet:  22px;
      --safe-t:   env(safe-area-inset-top,    0px);
      --safe-b:   env(safe-area-inset-bottom, 0px);
      --safe-l:   env(safe-area-inset-left,   0px);
      --safe-r:   env(safe-area-inset-right,  0px);
      --sheet-peek: 88px;
    }

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg0);
      overflow: hidden;
      font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      color: var(--label);
      overscroll-behavior: none;
    }

    /* ── Map ──────────────────────────────────────── */
    #map {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
    }

    /* Dark-mode the map: invert + hue-rotate flips light→dark */
    .maplibregl-canvas {
      filter: invert(1) hue-rotate(200deg) saturate(0.75) brightness(0.85);
    }

    /* Keep logos readable */
    .maplibregl-ctrl-attrib {
      font-size: 9px !important;
      background: rgba(0,0,0,0.5) !important;
      color: rgba(255,255,255,0.5) !important;
      filter: invert(1) hue-rotate(200deg);
    }
    .maplibregl-ctrl-logo { display: none !important; }

    /* ── Header ───────────────────────────────────── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      padding: calc(var(--safe-t) + 14px) 18px 18px;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.75) 0%,
        rgba(0,0,0,0.3)  60%,
        transparent      100%
      );
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    #header > * { pointer-events: auto; }

    .hdr-text {}
    .hdr-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }
    .hdr-sub {
      font-size: 12px;
      color: var(--label2);
      font-weight: 400;
      margin-top: 1px;
    }

    /* Fly Route button */
    #fly-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 22px;
      border: none;
      background: var(--blue);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      transition: background 0.25s, opacity 0.15s, transform 0.1s;
      box-shadow: 0 2px 16px rgba(10,132,255,0.4);
    }
    #fly-btn:active {
      opacity: 0.75;
      transform: scale(0.95);
    }
    #fly-btn.flying {
      background: var(--red);
      box-shadow: 0 2px 16px rgba(255,69,58,0.4);
    }
    .fly-icon { font-size: 12px; }

    /* ── Compass badge (top-right, below notch) ───── */
    #compass {
      position: fixed;
      top: calc(var(--safe-t) + 72px);
      right: 16px;
      z-index: 300;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(28,28,30,0.85);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 0.5px solid var(--sep);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #compass:active { transform: scale(0.9); }

    /* ── Progress dots ────────────────────────────── */
    #dots {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--safe-b) + var(--sheet-peek) + 12px);
      z-index: 250;
      display: flex;
      gap: 6px;
      align-items: center;
      transition: opacity 0.35s;
    }
    #dots.hidden { opacity: 0; pointer-events: none; }
    .dot {
      width: 6px; height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.3);
      transition: width 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
    }
    .dot.on { width: 20px; background: #fff; }

    /* ── Bottom Sheet ─────────────────────────────── */
    #sheet {
      position: fixed;
      inset: auto 0 0 0;
      z-index: 400;
      background: rgba(18, 18, 20, 0.94);
      -webkit-backdrop-filter: blur(48px) saturate(200%);
      backdrop-filter: blur(48px) saturate(200%);
      border-radius: var(--r-sheet) var(--r-sheet) 0 0;
      border-top: 0.5px solid var(--sep);
      box-shadow: 0 -4px 40px rgba(0,0,0,0.5);

      /* height = content; translated when collapsed */
      transform: translateY(0);
      transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
      touch-action: pan-y;
      /* prevent map touches through sheet */
      pointer-events: auto;
    }
    #sheet.collapsed {
      /* show only peek-height */
      transform: translateY(calc(100% - var(--sheet-peek) - var(--safe-b)));
    }

    /* drag handle area */
    .handle-zone {
      padding: 10px 0 6px;
      display: flex;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .handle {
      width: 38px; height: 4px;
      border-radius: 2px;
      background: var(--label3);
    }

    /* sheet title row (visible in peek) */
    .sheet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 10px;
      cursor: pointer;
    }
    .sheet-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .sheet-meta {
      font-size: 13px;
      color: var(--label2);
      background: var(--bg2);
      padding: 4px 10px;
      border-radius: 10px;
    }

    /* cards horizontal scroll */
    #cards {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      display: flex;
      gap: 12px;
      padding: 4px 20px calc(var(--safe-b) + 24px);
      scrollbar-width: none;
    }
    #cards::-webkit-scrollbar { display: none; }

    /* Day card */
    .card {
      flex: 0 0 calc(100vw - 56px);
      scroll-snap-align: start;
      background: var(--bg2);
      border-radius: var(--r-card);
      padding: 16px 18px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: border-color 0.25s, transform 0.15s, opacity 0.15s;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:active { transform: scale(0.975); opacity: 0.85; }
    .card.active  { border-color: var(--blue); }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(10,132,255,0.2);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 10px;
      letter-spacing: 0.2px;
      width: fit-content;
    }
    .card-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.1;
    }
    .card-sub {
      font-size: 13px;
      color: var(--label2);
      line-height: 1.4;
    }
    .card-stats {
      display: flex;
      gap: 18px;
      margin-top: auto;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }
    .stat-icon { font-size: 15px; }
    .stat-val  { font-weight: 600; color: var(--label); }
    .stat-lbl  { color: var(--label2); }

    /* ── Waypoint markers ─────────────────────────── */
    .wp-pin {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--blue);
      border: 2.5px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(0,0,0,0.55);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.2s;
      user-select: none;
    }
    .wp-pin:active   { transform: scale(0.88); }
    .wp-pin.active   { background: var(--green); transform: scale(1.18); }

    /* ── Loading overlay ──────────────────────────── */
    #loader {
      position: fixed; inset: 0; z-index: 900;
      background: var(--bg0);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      transition: opacity 0.6s;
    }
    #loader.fade { opacity: 0; pointer-events: none; }
    .loader-emoji { font-size: 52px; animation: pulse 2s ease-in-out infinite; }
    .loader-text  { font-size: 17px; font-weight: 600; color: var(--label2); }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1;   }
      50%       { transform: scale(1.08); opacity: 0.7; }
    }

    /* ── Notification toast ───────────────────────── */
    #toast {
      position: fixed;
      top: calc(var(--safe-t) + 68px);
      left: 50%; transform: translateX(-50%) translateY(-20px);
      z-index: 500;
      background: rgba(28,28,30,0.95);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 0.5px solid var(--sep);
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loader">
  <div class="loader-emoji">🌲</div>
  <div class="loader-text">Schwarzwald wird geladen…</div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Map container -->
<div id="map"></div>

<!-- Header -->
<div id="header">
  <div class="hdr-text">
    <div class="hdr-title">Schwarzwald Route</div>
    <div class="hdr-sub">13.–16. Mai 2026 · 2 Personen</div>
  </div>
  <button id="fly-btn" onclick="toggleFlyRoute()">
    <span class="fly-icon" id="fly-icon">▶</span>
    <span id="fly-label">Fly Route</span>
  </button>
</div>

<!-- Compass reset -->
<div id="compass" onclick="resetCamera()" title="Karte zurücksetzen">🧭</div>

<!-- Progress dots -->
<div id="dots">
  <div class="dot on" data-i="0"></div>
  <div class="dot"    data-i="1"></div>
  <div class="dot"    data-i="2"></div>
  <div class="dot"    data-i="3"></div>
</div>

<!-- Bottom sheet -->
<div id="sheet" class="collapsed">
  <div class="handle-zone" id="handle-zone">
    <div class="handle"></div>
  </div>
  <div class="sheet-top" onclick="toggleSheet()">
    <div class="sheet-title">Etappen</div>
    <div class="sheet-meta">4 Tage · Bulli</div>
  </div>
  <div id="cards"></div>
</div>

<script>
// ════════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════════
const WPS = [
  {
    id:       0,
    name:     'Baiersbronn',
    sub:      'Natur-Camp Tannenfels',
    day:      'Mi 13.05.',
    badge:    'Tag 1',
    emoji:    '🌲',
    lng:      8.3740,
    lat:      48.5079,
    zoom:     13.5,
    pitch:    62,
    bearing:  -25,
    color:    '#0a84ff',
    stats: [
      { icon: '🚗', val: '~480 km',   lbl: 'Anreise' },
      { icon: '🏕️', val: 'Tannenfels', lbl: 'Camp'   },
    ],
  },
  {
    id:       1,
    name:     'Ruhestein',
    sub:      'Wildseeblick · Nationalpark',
    day:      'Do 14.05.',
    badge:    'Tag 2',
    emoji:    '🦌',
    lng:      8.2541,
    lat:      48.5544,
    zoom:     14,
    pitch:    68,
    bearing:  18,
    color:    '#30d158',
    stats: [
      { icon: '🥾', val: '~10 km',  lbl: 'Wanderung' },
      { icon: '⏱️', val: '3–4 h',   lbl: 'Dauer'     },
    ],
  },
  {
    id:       2,
    name:     'Hinterzarten',
    sub:      'Camping Bankenhof · Titisee',
    day:      'Fr 15.05.',
    badge:    'Tag 3',
    emoji:    '🏔️',
    lng:      8.1186,
    lat:      47.9065,
    zoom:     13,
    pitch:    58,
    bearing:  8,
    color:    '#ff9f0a',
    stats: [
      { icon: '🥾', val: '~6 km',    lbl: 'Titisee'  },
      { icon: '🏕️', val: 'Bankenhof', lbl: 'Camp'    },
    ],
  },
  {
    id:       3,
    name:     'Feldberg',
    sub:      'Gipfel 1.493 m · Alpenblick',
    day:      'Sa 16.05.',
    badge:    'Tag 4',
    emoji:    '⛰️',
    lng:      8.0047,
    lat:      47.8742,
    zoom:     14.5,
    pitch:    72,
    bearing:  -48,
    color:    '#ff453a',
    stats: [
      { icon: '⛰️', val: '1.493 m',  lbl: 'Höhe'   },
      { icon: '🥾', val: '~2 h',     lbl: 'Rundweg' },
    ],
  },
];

const ROUTE_COORDS = WPS.map(w => [w.lng, w.lat]);

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let map, markers = [];
let activeIdx      = 0;
let sheetOpen      = false;
let isFlyingRoute  = false;
let flyTimer       = null;
let userScrolling  = false;
let scrollDebounce = null;

// ════════════════════════════════════════════════
//  MAP INIT
// ════════════════════════════════════════════════
function initMap() {
  map = new maplibregl.Map({
    container:        'map',
    style:            'https://tiles.openfreemap.org/styles/liberty',
    center:           [8.19, 48.23],
    zoom:             8.2,
    pitch:            45,
    bearing:          -8,
    antialias:        true,
    attributionControl: { compact: true },
    maxPitch:         80,
  });

  map.on('load', onMapLoad);
  map.on('error', onMapError);
}

function onMapLoad() {
  // ── Terrain DEM (AWS open-data terrarium, no key) ──
  map.addSource('terrain-dem', {
    type:     'raster-dem',
    tiles:    ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
    tileSize: 256,
    encoding: 'terrarium',
    maxzoom:  14,
  });
  map.setTerrain({ source: 'terrain-dem', exaggeration: 2.0 });

  // ── Atmospheric sky ────────────────────────────
  map.addLayer({
    id:   'sky',
    type: 'sky',
    paint: {
      'sky-type':                    'atmosphere',
      'sky-atmosphere-sun':          [0, 85],
      'sky-atmosphere-sun-intensity': 12,
    },
  });

  // ── Route: glow + line ─────────────────────────
  map.addSource('route', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: ROUTE_COORDS },
    },
  });
  map.addLayer({
    id: 'route-glow', type: 'line', source: 'route',
    paint: { 'line-color': '#0a84ff', 'line-width': 10, 'line-opacity': 0.18, 'line-blur': 6 },
  });
  map.addLayer({
    id: 'route-line', type: 'line', source: 'route',
    paint: {
      'line-color':     '#0a84ff',
      'line-width':     3,
      'line-opacity':   0.85,
      'line-dasharray': [3, 2],
    },
    layout: { 'line-cap': 'round', 'line-join': 'round' },
  });

  // ── Waypoint markers ───────────────────────────
  WPS.forEach((wp, i) => {
    const el = document.createElement('div');
    el.className = 'wp-pin' + (i === 0 ? ' active' : '');
    el.textContent = i + 1;
    el.style.setProperty('--mc', wp.color);
    if (i === 0) el.style.background = wp.color;
    el.addEventListener('click', () => flyTo(i));

    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([wp.lng, wp.lat])
      .addTo(map);
    markers.push({ marker: m, el });
  });

  // ── Build cards ────────────────────────────────
  buildCards();

  // ── Initial cinematic fly-in ───────────────────
  hideLoader();
  setTimeout(() => {
    map.flyTo({
      center:   [8.19, 48.22],
      zoom:     9.0,
      pitch:    52,
      bearing:  -10,
      duration: 2800,
      essential: true,
    });
    // Show sheet after overview settle
    setTimeout(() => openSheet(), 3400);
  }, 300);
}

function onMapError(e) {
  console.warn('Map error:', e);
  hideLoader();
}

function hideLoader() {
  const l = document.getElementById('loader');
  l.classList.add('fade');
  setTimeout(() => l.remove(), 700);
}

// ════════════════════════════════════════════════
//  CARDS
// ════════════════════════════════════════════════
function buildCards() {
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  WPS.forEach((wp, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === 0 ? ' active' : '');
    card.innerHTML = `
      <div class="card-badge">${wp.emoji} ${wp.badge} · ${wp.day}</div>
      <div class="card-name">${wp.name}</div>
      <div class="card-sub">${wp.sub}</div>
      <div class="card-stats">
        ${wp.stats.map(s => `
          <div class="stat">
            <span class="stat-icon">${s.icon}</span>
            <span class="stat-val">${s.val}</span>
            <span class="stat-lbl"> ${s.lbl}</span>
          </div>
        `).join('')}
      </div>
    `;
    card.addEventListener('click', () => flyTo(i));
    wrap.appendChild(card);
  });

  // Sync scroll → active waypoint
  wrap.addEventListener('scroll', onCardsScroll, { passive: true });
}

function onCardsScroll() {
  if (userScrolling) return; // don't fight programmatic scroll
  clearTimeout(scrollDebounce);
  scrollDebounce = setTimeout(() => {
    const wrap    = document.getElementById('cards');
    const cardW   = (wrap.firstElementChild?.offsetWidth ?? 0) + 12;
    const idx     = Math.round(wrap.scrollLeft / cardW);
    if (idx >= 0 && idx < WPS.length && idx !== activeIdx) {
      setActive(idx);
      flyTo(idx, true); // fromScroll=true, skip card scroll
    }
  }, 120);
}

function scrollCardIntoView(idx) {
  const wrap  = document.getElementById('cards');
  const cardW = (wrap.firstElementChild?.offsetWidth ?? 0) + 12;
  userScrolling = true;
  wrap.scrollTo({ left: idx * cardW, behavior: 'smooth' });
  setTimeout(() => { userScrolling = false; }, 600);
}

// ════════════════════════════════════════════════
//  ACTIVE STATE
// ════════════════════════════════════════════════
function setActive(idx) {
  activeIdx = idx;

  // cards
  document.querySelectorAll('.card')
    .forEach((c, i) => c.classList.toggle('active', i === idx));

  // markers
  markers.forEach(({ el }, i) => {
    el.classList.toggle('active', i === idx);
    el.style.background = i === idx ? WPS[i].color : WPS[i].color;
    el.style.transform  = i === idx ? 'scale(1.18)' : '';
  });

  // dots
  document.querySelectorAll('.dot')
    .forEach((d, i) => d.classList.toggle('on', i === idx));
}

// ════════════════════════════════════════════════
//  CAMERA
// ════════════════════════════════════════════════
function flyTo(idx, fromScroll = false) {
  if (!map) return;
  const wp = WPS[idx];
  setActive(idx);
  if (!fromScroll) scrollCardIntoView(idx);

  map.flyTo({
    center:    [wp.lng, wp.lat],
    zoom:      wp.zoom,
    pitch:     wp.pitch,
    bearing:   wp.bearing,
    duration:  2400,
    essential: true,
    curve:     1.35,
    speed:     0.75,
  });
}

function resetCamera() {
  if (!map) return;
  map.flyTo({
    center:    [8.19, 48.22],
    zoom:      9.0,
    pitch:     48,
    bearing:   -10,
    duration:  1800,
    essential: true,
  });
}

// ════════════════════════════════════════════════
//  FLY ROUTE AUTO-TOUR
// ════════════════════════════════════════════════
function toggleFlyRoute() {
  isFlyingRoute ? stopFlyRoute() : startFlyRoute();
}

function startFlyRoute() {
  isFlyingRoute = true;
  document.getElementById('fly-btn').classList.add('flying');
  document.getElementById('fly-icon').textContent  = '■';
  document.getElementById('fly-label').textContent = 'Stop';
  document.getElementById('dots').classList.add('hidden');

  // Close sheet for unobstructed view
  closeSheet();
  showToast('Automatischer Kamera-Flug 🎬');

  let step = 0;
  function next() {
    if (!isFlyingRoute) return;
    if (step >= WPS.length) { stopFlyRoute(); return; }
    flyTo(step);
    step++;
    flyTimer = setTimeout(next, 4200);
  }
  next();
}

function stopFlyRoute() {
  isFlyingRoute = false;
  if (flyTimer) { clearTimeout(flyTimer); flyTimer = null; }
  document.getElementById('fly-btn').classList.remove('flying');
  document.getElementById('fly-icon').textContent  = '▶';
  document.getElementById('fly-label').textContent = 'Fly Route';
  document.getElementById('dots').classList.remove('hidden');
  openSheet();
}

// ════════════════════════════════════════════════
//  SHEET
// ════════════════════════════════════════════════
function openSheet()  { sheetOpen = true;  document.getElementById('sheet').classList.remove('collapsed'); }
function closeSheet() { sheetOpen = false; document.getElementById('sheet').classList.add('collapsed'); }
function toggleSheet() { sheetOpen ? closeSheet() : openSheet(); }

// Touch-drag for sheet ──────────────────────────
(function setupDrag() {
  const sheet = document.getElementById('sheet');
  let startY = 0, startOpen = false, dragging = false;

  sheet.addEventListener('touchstart', e => {
    // Only initiate drag from handle zone or sheet-top
    const target = e.target;
    const zone   = document.getElementById('handle-zone');
    const top    = document.querySelector('.sheet-top');
    if (!zone.contains(target) && !top.contains(target)) return;
    startY    = e.touches[0].clientY;
    startOpen = sheetOpen;
    dragging  = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  sheet.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    if (dy >  55 && startOpen)  closeSheet();
    if (dy < -55 && !startOpen) openSheet();
  }, { passive: true });
})();

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ════════════════════════════════════════════════
//  PWA MANIFEST (blob — no separate file needed)
// ════════════════════════════════════════════════
(function injectManifest() {
  const manifest = {
    name:             'Schwarzwald Route',
    short_name:       'Schwarzwald',
    description:      'Schwarzwald Trip 13.–16. Mai 2026 · Baiersbronn → Feldberg',
    start_url:        './',
    display:          'standalone',
    background_color: '#000000',
    theme_color:      '#000000',
    orientation:      'portrait-primary',
    icons: [{
      src:   "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><text y='.9em' font-size='76' x='12'>🌲</text></svg>",
      sizes: '512x512',
      type:  'image/svg+xml',
      purpose: 'any maskable',
    }],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel   = 'manifest';
  link.href  = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

// ════════════════════════════════════════════════
//  SERVICE WORKER (inline blob)
// ════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  const CACHE = 'schwarzwald-v1';
  const SW = `
const CACHE = '${CACHE}';
self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
});
self.addEventListener('activate', e => {
  self.clients.claim();
  e.waitUntil(
    caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k))))
  );
});
self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  // Cache-first for tile requests (offline maps)
  const isTile = /\/(tiles|terrarium|terrain)\//i.test(e.request.url)
               || e.request.url.includes('.mvt')
               || e.request.url.includes('.png?');
  if (isTile) {
    e.respondWith(
      caches.open(CACHE).then(cache =>
        cache.match(e.request).then(hit => {
          const net = fetch(e.request).then(res => { cache.put(e.request, res.clone()); return res; });
          return hit || net;
        })
      )
    );
    return;
  }
  // Network-first for app shell
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});
  `;
  try {
    const blob = new Blob([SW], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  } catch (_) {}
}

// ════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════
initMap();
</script>
