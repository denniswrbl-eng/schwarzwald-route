<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Schwarzwald">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><text y='.9em' font-size='76' x='12'>🌲</text></svg>">
  <title>Schwarzwald Route</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    :root {
      --bg0: #000000;
      --bg1: #1c1c1e;
      --bg2: #2c2c2e;
      --bg3: #3a3a3c;
      --label:  #ffffff;
      --label2: rgba(255,255,255,0.6);
      --label3: rgba(255,255,255,0.3);
      --blue:   #0a84ff;
      --green:  #30d158;
      --red:    #ff453a;
      --orange: #ff9f0a;
      --purple: #bf5af2;
      --sep:    rgba(255,255,255,0.12);
      --r-card:  16px;
      --r-sheet: 22px;
      --safe-t: env(safe-area-inset-top,    0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --sheet-peek: 88px;
      --accent: var(--blue);
    }
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg0);
      overflow: hidden;
      font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
      color: var(--label);
      overscroll-behavior: none;
    }

    /* Map */
    #map { position: fixed; inset: 0; }
    .maplibregl-ctrl-attrib {
      font-size: 9px !important;
      background: rgba(0,0,0,0.6) !important;
      color: rgba(255,255,255,0.4) !important;
    }
    .maplibregl-ctrl-logo { display: none !important; }

    /* Header */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      padding: calc(var(--safe-t) + 14px) 18px 16px;
      background: linear-gradient(to bottom,rgba(0,0,0,0.78) 0%,rgba(0,0,0,0.3) 65%,transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    #header > * { pointer-events: auto; }

    .hdr-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .hdr-title { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; }
    .hdr-sub   { font-size: 12px; color: var(--label2); margin-top: 1px; }

    /* Fly button */
    #fly-btn {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 9px 16px;
      border-radius: 22px; border: none;
      background: var(--accent);
      color: #fff;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: background 0.25s, opacity 0.15s, transform 0.1s;
      box-shadow: 0 2px 16px rgba(10,132,255,0.35);
    }
    #fly-btn:active { opacity: 0.75; transform: scale(0.95); }
    #fly-btn.flying { background: var(--red); box-shadow: 0 2px 16px rgba(255,69,58,0.4); }

    /* Option toggle (segmented control) */
    #option-toggle {
      display: flex;
      background: rgba(28,28,30,0.85);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 0.5px solid var(--sep);
      padding: 3px;
      gap: 3px;
      align-self: flex-start;
    }
    .opt-btn {
      padding: 7px 14px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--label2);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .opt-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* Compass */
    #compass {
      position: fixed;
      top: calc(var(--safe-t) + 106px);
      right: 16px;
      z-index: 300;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(28,28,30,0.85);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 0.5px solid var(--sep);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #compass:active { transform: scale(0.9); }

    /* Progress dots */
    #dots {
      position: fixed;
      left: 50%; transform: translateX(-50%);
      bottom: calc(var(--safe-b) + var(--sheet-peek) + 12px);
      z-index: 250;
      display: flex; gap: 6px; align-items: center;
      transition: opacity 0.35s;
    }
    #dots.hidden { opacity: 0; pointer-events: none; }
    .dot {
      width: 6px; height: 6px; border-radius: 3px;
      background: rgba(255,255,255,0.3);
      transition: width 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
    }
    .dot.on { width: 20px; background: #fff; }

    /* Bottom Sheet */
    #sheet {
      position: fixed; inset: auto 0 0 0;
      z-index: 400;
      background: rgba(18,18,20,0.94);
      -webkit-backdrop-filter: blur(48px) saturate(200%);
      backdrop-filter: blur(48px) saturate(200%);
      border-radius: var(--r-sheet) var(--r-sheet) 0 0;
      border-top: 0.5px solid var(--sep);
      box-shadow: 0 -4px 40px rgba(0,0,0,0.5);
      transform: translateY(0);
      transition: transform 0.42s cubic-bezier(0.32,0.72,0,1);
      will-change: transform;
      touch-action: pan-y;
    }
    #sheet.collapsed {
      transform: translateY(calc(100% - var(--sheet-peek) - var(--safe-b)));
    }
    .handle-zone {
      padding: 10px 0 6px;
      display: flex; justify-content: center;
      cursor: pointer; user-select: none;
    }
    .handle {
      width: 38px; height: 4px;
      border-radius: 2px;
      background: var(--label3);
    }
    .sheet-top {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 20px 10px;
      cursor: pointer;
    }
    .sheet-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .sheet-meta {
      font-size: 13px; color: var(--label2);
      background: var(--bg2);
      padding: 4px 10px; border-radius: 10px;
    }

    /* Cards */
    #cards {
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      touch-action: pan-x;
      display: flex; gap: 12px;
      padding: 4px 20px calc(var(--safe-b) + 24px);
      scrollbar-width: none;
    }
    #cards::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 calc(100vw - 56px);
      scroll-snap-align: start;
      background: var(--bg2);
      border-radius: var(--r-card);
      padding: 16px 18px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: border-color 0.25s, transform 0.15s, opacity 0.15s;
      min-height: 148px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card:active { transform: scale(0.975); opacity: 0.85; }
    .card.active  { border-color: var(--accent); }

    .card-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(10,132,255,0.18);
      color: var(--accent);
      font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 10px;
      letter-spacing: 0.2px; width: fit-content;
    }
    .card-badge.train { background: rgba(191,90,242,0.18); color: var(--purple); }
    .card-name  { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
    .card-sub   { font-size: 13px; color: var(--label2); line-height: 1.4; }
    .card-stats { display: flex; gap: 18px; margin-top: auto; }
    .stat       { display: flex; align-items: center; gap: 5px; font-size: 13px; }
    .stat-icon  { font-size: 15px; }
    .stat-val   { font-weight: 600; color: var(--label); }
    .stat-lbl   { color: var(--label2); }

    /* Card photo */
    .card-photo {
      width: 100%; height: 130px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    /* Travel info row (Option B only) */
    .travel-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--label2);
      padding: 6px 10px;
      background: rgba(191,90,242,0.1);
      border-radius: 10px;
    }
    .travel-row strong { color: var(--purple); }

    /* Waypoint markers */
    .wp-pin {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--blue);
      border: 2.5px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(0,0,0,0.55);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.2s;
      user-select: none;
    }
    .wp-pin:active { transform: scale(0.88); }
    .wp-pin.active { transform: scale(1.18); }
    .wp-pin.train-pin { background: var(--purple); border-color: rgba(255,255,255,0.9); }

    /* Train station markers (dots along route) */
    .train-stop {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--purple);
      border: 2px solid rgba(255,255,255,0.6);
      box-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    /* Loading */
    #loader {
      position: fixed; inset: 0; z-index: 900;
      background: var(--bg0);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      transition: opacity 0.6s;
    }
    #loader.fade { opacity: 0; pointer-events: none; }
    .loader-emoji { font-size: 52px; animation: pulse 2s ease-in-out infinite; }
    .loader-text  { font-size: 17px; font-weight: 600; color: var(--label2); }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.08); opacity: 0.7; }
    }

    /* Toast */
    #toast {
      position: fixed;
      top: calc(var(--safe-t) + 80px);
      left: 50%; transform: translateX(-50%) translateY(-20px);
      z-index: 500;
      background: rgba(28,28,30,0.95);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 0.5px solid var(--sep);
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 14px; font-weight: 500;
      white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="loader">
  <div class="loader-emoji">🌲</div>
  <div class="loader-text">Schwarzwald wird geladen…</div>
</div>

<div id="toast"></div>
<div id="map"></div>

<!-- Header -->
<div id="header">
  <div class="hdr-row1">
    <div>
      <div class="hdr-title">Schwarzwald Route</div>
      <div class="hdr-sub">13.–16. Mai 2026 · 2 Personen</div>
    </div>
    <button id="fly-btn" onclick="toggleFlyRoute()">
      <span id="fly-icon" style="font-size:12px">▶</span>
      <span id="fly-label">Fly Route</span>
    </button>
  </div>

  <!-- Option toggle -->
  <div id="option-toggle">
    <button class="opt-btn active" id="btn-a" onclick="switchOption('A')">🚐 Option A · Bulli</button>
    <button class="opt-btn"        id="btn-b" onclick="switchOption('B')">🚂 Option B · Zug</button>
  </div>
</div>

<div id="compass" onclick="resetCamera()">🧭</div>

<div id="dots">
  <div class="dot on" data-i="0"></div>
  <div class="dot"    data-i="1"></div>
  <div class="dot"    data-i="2"></div>
  <div class="dot"    data-i="3"></div>
</div>

<div id="sheet" class="collapsed">
  <div class="handle-zone" id="handle-zone"><div class="handle"></div></div>
  <div class="sheet-top" onclick="toggleSheet()">
    <div class="sheet-title" id="sheet-title">Etappen</div>
    <div class="sheet-meta" id="sheet-meta">4 Tage · Bulli</div>
  </div>
  <div id="cards"></div>
</div>

<script>
// ════════════════════════════════════════════════
//  DATA — OPTION A (Bulli)
// ════════════════════════════════════════════════
const WPS_A = [
  {
    id: 0, name: 'Zwischenstopp Pfalz', sub: '~320 km · Bulli-Schlaf',
    day: 'Mi 13.05.', badge: 'Tag 1', emoji: '🌙',
    lng: 8.1397, lat: 49.3517,
    zoom: 10, pitch: 35, bearing: 0,
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Weinberge_bei_Pleisweiler.JPG?width=600',
    stats: [
      { icon: '🚐', val: '~320 km', lbl: 'von Hamm' },
      { icon: '🌙', val: 'Pfalz', lbl: 'Übernachtung' },
    ],
  },
  {
    id: 1, name: 'Ruhestein', sub: 'Wildseeblick · Nationalpark',
    day: 'Do 14.05.', badge: 'Tag 2', emoji: '🦌',
    lng: 8.2541, lat: 48.5544,
    zoom: 13.5, pitch: 55, bearing: 18,
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Nationalpark_Schwarzwald_Wildsee-1.jpg?width=600',
    stats: [
      { icon: '🥾', val: '~10 km', lbl: 'Wanderung' },
      { icon: '⏱️', val: '3–4 h',  lbl: 'Dauer' },
    ],
  },
  {
    id: 2, name: 'Feldberg', sub: 'Gipfel 1.493 m · Alpenblick',
    day: 'Fr 15.05.', badge: 'Tag 3', emoji: '⛰️',
    lng: 8.0047, lat: 47.8742,
    zoom: 13.5, pitch: 54, bearing: -35,
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/2012_Schwarzwald_101_Feldberg_Gipfel.JPG?width=600',
    stats: [
      { icon: '⛰️', val: '1.493 m', lbl: 'Höhe' },
      { icon: '🥾', val: '~2 h',    lbl: 'Rundweg' },
    ],
  },
  {
    id: 3, name: 'Triberg', sub: 'Wasserfälle 163 m · Heimweg',
    day: 'Sa 16.05.', badge: 'Tag 4', emoji: '💧',
    lng: 8.2220, lat: 48.0617,
    zoom: 14, pitch: 50, bearing: 10,
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Wasserfall_triberg.jpg?width=600',
    stats: [
      { icon: '💧', val: '163 m',  lbl: 'Fallhöhe' },
      { icon: '⏱️', val: '~2 h',   lbl: 'Spaziergang' },
    ],
  },
];

// ════════════════════════════════════════════════
//  DATA — OPTION B (Zug + Zelt)
// ════════════════════════════════════════════════
const WPS_B = [
  {
    id: 0, name: 'Anreise', sub: 'Dortmund → Köln → Freiburg → Titisee',
    day: 'Mi 13.05.', badge: 'Tag 1', emoji: '🚂', isTrain: true,
    lng: 8.1430, lat: 47.8970,
    zoom: 11, pitch: 48, bearing: 10,
    travel: 'Dortmund Hbf → Köln → Freiburg → Titisee  ·  ~4,5 h  ·  2 Umstiege',
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Titisee_(3).JPG?width=600',
    stats: [
      { icon: '🚂', val: '~4,5 h', lbl: 'Fahrtzeit' },
      { icon: '🏕️', val: 'Bankenhof', lbl: 'Camp' },
    ],
  },
  {
    id: 1, name: 'Feldberg', sub: 'Gipfelrunde via KONUS-Bus',
    day: 'Do 14.05.', badge: 'Tag 2', emoji: '⛰️', isTrain: true,
    lng: 8.0047, lat: 47.8742,
    zoom: 14.5, pitch: 72, bearing: -40,
    travel: 'KONUS-Bus ab Hinterzarten  ·  kostenlos mit Gästekarte',
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/2012_Schwarzwald_101_Feldberg_Gipfel.JPG?width=600',
    stats: [
      { icon: '⛰️', val: '1.493 m', lbl: 'Höhe' },
      { icon: '🥾', val: '~12 km',  lbl: 'Gipfelrunde' },
    ],
  },
  {
    id: 2, name: 'Schluchsee', sub: 'Dreiseenbahn · Schwimmen',
    day: 'Fr 15.05.', badge: 'Tag 3', emoji: '🏊', isTrain: true,
    lng: 8.0090, lat: 47.8195,
    zoom: 13.5, pitch: 60, bearing: 25,
    travel: 'Dreiseenbahn ab Hinterzarten  ·  ~20 min',
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Schluchsee_Sommer_2012_-_3.jpg?width=600',
    stats: [
      { icon: '🚞', val: 'Dreiseenbahn', lbl: 'Anreise' },
      { icon: '🏊', val: 'Schwimmen',    lbl: 'Schluchsee' },
    ],
  },
  {
    id: 3, name: 'Triberg', sub: 'Wasserfälle · Schwarzwaldbahn heimwärts',
    day: 'Sa 16.05.', badge: 'Tag 4', emoji: '💧', isTrain: true,
    lng: 8.2220, lat: 48.0617,
    zoom: 14, pitch: 50, bearing: 10,
    travel: 'Schwarzwaldbahn: Titisee → Freiburg → Offenburg → Triberg  ·  dann weiter Dortmund',
    photo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Wasserfall_triberg.jpg?width=600',
    stats: [
      { icon: '💧', val: '163 m',  lbl: 'Wasserfälle' },
      { icon: '🚂', val: '~6 h',   lbl: 'Heimfahrt' },
    ],
  },
];

// Zugstrecke: Hamm → Köln → Mannheim → Freiburg → Titisee
const TRAIN_ROUTE = [
  [7.459, 51.518],   // Dortmund Hbf (Start gemeinsam)
  [6.959, 50.943],   // Köln Hbf
  [8.469, 49.480],   // Mannheim Hbf
  [8.403, 49.009],   // Karlsruhe Hbf
  [7.776, 48.481],   // Offenburg
  [7.842, 47.997],   // Freiburg Hbf
  [7.939, 47.975],   // Himmelreich
  [8.143, 47.897],   // Titisee-Neustadt (Camp)
  [8.222, 48.062],   // Triberg (Schwarzwaldbahn, Heimweg)
];

// Zwischenstopps (kleine Punkte auf der Strecke)
const TRAIN_STOPS = [
  { name: 'Dortmund Hbf',  lng: 7.459,  lat: 51.518 },
  { name: 'Köln Hbf',      lng: 6.959,  lat: 50.943 },
  { name: 'Mannheim Hbf',  lng: 8.469,  lat: 49.480 },
  { name: 'Freiburg Hbf',  lng: 7.842,  lat: 47.997 },
  { name: 'Titisee',       lng: 8.143,  lat: 47.897 },
  { name: 'Triberg',       lng: 8.222,  lat: 48.062 },
];

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let map, markers = [], stopMarkers = [];
let currentOption  = 'A';
let activeIdx      = 0;
let sheetOpen      = false;
let isFlyingRoute  = false;
let flyTimer       = null;
let introSheetTimer = null;
let userScrolling  = false;
let scrollDebounce = null;
let scrollRAF      = null;

function activeWps() { return currentOption === 'A' ? WPS_A : WPS_B; }

// ════════════════════════════════════════════════
//  MAP INIT
// ════════════════════════════════════════════════
function initMap() {
  map = new maplibregl.Map({
    container: 'map',
    style:     DARK_STYLE,
    center:    [8.19, 48.23],
    zoom:      8.2, pitch: 45, bearing: -8,
    antialias: false,
    attributionControl: { compact: true },
    maxPitch: 80,
    fadeDuration: 0,
  });
  map.on('load', onMapLoad);
  map.on('error', () => hideLoader());
}

function onMapLoad() {
  // 3D-Terrain deaktiviert — terrarium-DEM-Tiles waren auf Mobile-GPU
  // zu schwer und blockierten das Tile-Streaming. Map bleibt 2.5D
  // (pitch/bearing funktionieren weiterhin).

  // (kein Sky-Layer — MapLibre 4.7.1 unterstützt type:'sky' nicht;
  // der dunkle bg-Background-Layer dient als Horizont/Sky-Ersatz)

  // ── Option A: Bulli route ──────────────────────
  map.addSource('route-a', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: WPS_A.map(w => [w.lng, w.lat]) } },
  });
  map.addLayer({ id: 'route-a-glow', type: 'line', source: 'route-a',
    paint: { 'line-color': '#0a84ff', 'line-width': 10, 'line-opacity': 0.18, 'line-blur': 6 } });
  map.addLayer({ id: 'route-a-line', type: 'line', source: 'route-a',
    paint: { 'line-color': '#0a84ff', 'line-width': 3, 'line-opacity': 0.9, 'line-dasharray': [3,2] },
    layout: { 'line-cap': 'round', 'line-join': 'round' } });

  // ── Option B: Zugstrecke ───────────────────────
  map.addSource('route-b', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: TRAIN_ROUTE } },
  });
  map.addLayer({ id: 'route-b-glow', type: 'line', source: 'route-b',
    paint: { 'line-color': '#bf5af2', 'line-width': 10, 'line-opacity': 0.15, 'line-blur': 6 },
    layout: { visibility: 'none' } });
  map.addLayer({ id: 'route-b-line', type: 'line', source: 'route-b',
    paint: { 'line-color': '#bf5af2', 'line-width': 3, 'line-opacity': 0.9, 'line-dasharray': [2, 3] },
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' } });

  // Option B: lokale Tagesrouten (Hinterzarten ↔ Feldberg, ↔ Schluchsee)
  const localB = [
    [[8.1186, 47.9065], [8.0047, 47.8742]],   // Hinterzarten → Feldberg
    [[8.1186, 47.9065], [8.0090, 47.8195]],   // Hinterzarten → Schluchsee
    [[8.1186, 47.9065], [8.1500, 47.8980]],   // Hinterzarten → Titisee
  ];
  map.addSource('route-b-local', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: localB.map(coords => ({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: coords },
      })),
    },
  });
  map.addLayer({ id: 'route-b-local-line', type: 'line', source: 'route-b-local',
    paint: { 'line-color': '#bf5af2', 'line-width': 2, 'line-opacity': 0.6, 'line-dasharray': [1,3] },
    layout: { 'line-cap': 'round', visibility: 'none' } });

  // ── Waypoint markers ───────────────────────────
  buildMarkers();

  // ── Train stop dots ───────────────────────────
  buildTrainStops();

  // ── Cards ──────────────────────────────────────
  buildCards();

  // ── Scroll-Listener einmalig anhängen (Bug 1) ─
  document.getElementById('cards')
    .addEventListener('scroll', onCardsScroll, { passive: true });

  // ── Intro fly-in ──────────────────────────────
  hideLoader();
  setTimeout(() => {
    map.flyTo({ center: [8.19, 48.22], zoom: 9.0, pitch: 52, bearing: -10, duration: 2800, essential: true });
    introSheetTimer = setTimeout(() => {
      introSheetTimer = null;
      if (!isFlyingRoute) openSheet();
    }, 3400);
  }, 300);
}

// ════════════════════════════════════════════════
//  MARKERS
// ════════════════════════════════════════════════
function buildMarkers() {
  markers.forEach(({ marker }) => marker.remove());
  markers = [];

  activeWps().forEach((wp, i) => {
    const el = document.createElement('div');
    el.className = 'wp-pin' + (i === activeIdx ? ' active' : '') + (wp.isTrain ? ' train-pin' : '');
    el.textContent = i + 1;
    el.addEventListener('click', () => flyTo(i));
    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([wp.lng, wp.lat]).addTo(map);
    markers.push({ marker: m, el });
  });
}

function buildTrainStops() {
  stopMarkers.forEach(m => m.remove());
  stopMarkers = [];
  if (currentOption !== 'B') return;

  TRAIN_STOPS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'train-stop';
    el.title = s.name;
    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([s.lng, s.lat]).addTo(map);
    stopMarkers.push(m);
  });
}

// ════════════════════════════════════════════════
//  OPTION SWITCH
// ════════════════════════════════════════════════
function switchOption(opt) {
  if (currentOption === opt) return;
  if (!map || !map.isStyleLoaded()) return;
  currentOption = opt;
  activeIdx = 0;

  // Toggle button states
  document.getElementById('btn-a').classList.toggle('active', opt === 'A');
  document.getElementById('btn-b').classList.toggle('active', opt === 'B');

  // Map layer visibility
  const showA = opt === 'A' ? 'visible' : 'none';
  const showB = opt === 'B' ? 'visible' : 'none';
  ['route-a-glow', 'route-a-line'].forEach(id => map.setLayoutProperty(id, 'visibility', showA));
  ['route-b-glow', 'route-b-line', 'route-b-local-line'].forEach(id => map.setLayoutProperty(id, 'visibility', showB));

  // Accent color CSS
  document.documentElement.style.setProperty('--accent', opt === 'A' ? 'var(--blue)' : 'var(--purple)');

  // Update sheet meta
  document.getElementById('sheet-meta').textContent = opt === 'A' ? '4 Tage · Bulli' : '4 Tage · Zug + Zelt';

  // Rebuild markers + stops + cards
  buildMarkers();
  buildTrainStops();
  buildCards();
  setActive(0);

  // Camera: zoom out to show full train route for B
  if (opt === 'B') {
    map.flyTo({ center: [7.8, 49.8], zoom: 5.5, pitch: 35, bearing: 0, duration: 2200, essential: true });
    showToast('Option B: Zug + Zelt 🚂');
  } else {
    map.flyTo({ center: [8.19, 48.22], zoom: 9.0, pitch: 52, bearing: -10, duration: 2000, essential: true });
    showToast('Option A: Bulli 🚐');
  }
}

// ════════════════════════════════════════════════
//  CARDS
// ════════════════════════════════════════════════
function buildCards() {
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  activeWps().forEach((wp, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === activeIdx ? ' active' : '');
    const badgeClass = wp.isTrain ? 'card-badge train' : 'card-badge';
    card.innerHTML = `
      ${wp.photo ? `<img class="card-photo" src="${wp.photo}" alt="${wp.name}" loading="lazy" onerror="this.style.display='none'">` : ''}
      <div class="${badgeClass}">${wp.emoji} ${wp.badge} · ${wp.day}</div>
      <div class="card-name">${wp.name}</div>
      <div class="card-sub">${wp.sub}</div>
      ${wp.travel ? `<div class="travel-row">🚆 <strong>${wp.travel.split('·')[0].trim()}</strong>${wp.travel.includes('·') ? ' · ' + wp.travel.split('·').slice(1).join('·').trim() : ''}</div>` : ''}
      <div class="card-stats">
        ${wp.stats.map(s => `
          <div class="stat">
            <span class="stat-icon">${s.icon}</span>
            <span class="stat-val">${s.val}</span>
            <span class="stat-lbl"> ${s.lbl}</span>
          </div>
        `).join('')}
      </div>
    `;
    card.addEventListener('click', () => flyTo(i));
    wrap.appendChild(card);
  });
}

function onCardsScroll() {
  if (userScrolling || isFlyingRoute) return;
  clearTimeout(scrollDebounce);
  scrollDebounce = setTimeout(() => {
    const wrap  = document.getElementById('cards');
    const cardW = (wrap.firstElementChild?.offsetWidth ?? 0) + 12;
    const idx   = Math.round(wrap.scrollLeft / cardW);
    if (idx >= 0 && idx < activeWps().length && idx !== activeIdx) {
      setActive(idx);
      flyTo(idx, true);
    }
  }, 120);
}

function scrollCardIntoView(idx) {
  if (scrollRAF) { cancelAnimationFrame(scrollRAF); scrollRAF = null; }
  const wrap  = document.getElementById('cards');
  const cardW = (wrap.firstElementChild?.offsetWidth ?? 0) + 12;
  userScrolling = true;
  wrap.scrollTo({ left: idx * cardW, behavior: 'smooth' });
  let last = wrap.scrollLeft, stableFrames = 0;
  const tick = () => {
    if (Math.abs(wrap.scrollLeft - last) < 0.5) {
      if (++stableFrames > 6) { userScrolling = false; scrollRAF = null; return; }
    } else { stableFrames = 0; last = wrap.scrollLeft; }
    scrollRAF = requestAnimationFrame(tick);
  };
  scrollRAF = requestAnimationFrame(tick);
}

// ════════════════════════════════════════════════
//  ACTIVE STATE
// ════════════════════════════════════════════════
function setActive(idx) {
  activeIdx = idx;
  document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i === idx));
  markers.forEach(({ el }, i) => {
    el.classList.toggle('active', i === idx);
    el.style.transform = i === idx ? 'scale(1.18)' : '';
  });
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === idx));
}

// ════════════════════════════════════════════════
//  CAMERA
// ════════════════════════════════════════════════
function flyTo(idx, fromScroll = false) {
  if (!map) return;
  const wp = activeWps()[idx];
  setActive(idx);
  if (!fromScroll) scrollCardIntoView(idx);
  map.flyTo({
    center: [wp.lng, wp.lat], zoom: wp.zoom, pitch: wp.pitch, bearing: wp.bearing,
    duration: 1800, essential: true, curve: 1.2, speed: 0.9,
  });
}

function resetCamera() {
  if (!map) return;
  if (currentOption === 'B') {
    map.flyTo({ center: [7.8, 49.8], zoom: 5.5, pitch: 35, bearing: 0, duration: 1800, essential: true });
  } else {
    map.flyTo({ center: [8.19, 48.22], zoom: 9.0, pitch: 48, bearing: -10, duration: 1800, essential: true });
  }
}

// ════════════════════════════════════════════════
//  FLY ROUTE
// ════════════════════════════════════════════════
function toggleFlyRoute() { isFlyingRoute ? stopFlyRoute() : startFlyRoute(); }

function startFlyRoute() {
  if (introSheetTimer) { clearTimeout(introSheetTimer); introSheetTimer = null; }
  isFlyingRoute = true;
  document.getElementById('fly-btn').classList.add('flying');
  document.getElementById('fly-icon').textContent  = '■';
  document.getElementById('fly-label').textContent = 'Stop';
  document.getElementById('dots').classList.add('hidden');
  closeSheet();
  showToast('Automatischer Kamera-Flug 🎬');

  let step = 0;
  function next() {
    if (!isFlyingRoute) return;
    if (step >= activeWps().length) { stopFlyRoute(); return; }
    flyTo(step); step++;
    flyTimer = setTimeout(next, 4200);
  }
  next();
}

function stopFlyRoute() {
  isFlyingRoute = false;
  if (flyTimer) { clearTimeout(flyTimer); flyTimer = null; }
  document.getElementById('fly-btn').classList.remove('flying');
  document.getElementById('fly-icon').textContent  = '▶';
  document.getElementById('fly-label').textContent = 'Fly Route';
  document.getElementById('dots').classList.remove('hidden');
  openSheet();
}

// ════════════════════════════════════════════════
//  SHEET
// ════════════════════════════════════════════════
function openSheet()   { sheetOpen = true;  document.getElementById('sheet').classList.remove('collapsed'); }
function closeSheet()  { sheetOpen = false; document.getElementById('sheet').classList.add('collapsed'); }
function toggleSheet() { sheetOpen ? closeSheet() : openSheet(); }

(function setupDrag() {
  const sheet = document.getElementById('sheet');
  let startY = 0, startOpen = false, dragging = false;
  sheet.addEventListener('touchstart', e => {
    const t = e.target;
    if (!document.getElementById('handle-zone').contains(t) && !document.querySelector('.sheet-top').contains(t)) return;
    startY = e.touches[0].clientY; startOpen = sheetOpen; dragging = true;
  }, { passive: true });
  sheet.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 55 && startOpen)   closeSheet();
    if (dy < -55 && !startOpen) openSheet();
  }, { passive: true });
  sheet.addEventListener('touchcancel', () => {
    if (!dragging) return;
    dragging = false;
  }, { passive: true });
})();

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ════════════════════════════════════════════════
//  LOADING
// ════════════════════════════════════════════════
function hideLoader() {
  const l = document.getElementById('loader');
  if (!l || l.classList.contains('fade')) return;
  l.classList.add('fade');
  setTimeout(() => l.remove(), 700);
}
